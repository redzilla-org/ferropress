[package]
name = "infra-dsql"
description = "Aurora DSQL adapter for the cms-db SQL store port over the PostgreSQL wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# test-util ships the in-process fake PostgreSQL server so tests never need a live DSQL cluster.
[features]
test-util = []

# Infrastructure layer: only the cms-db port, plus rustls because DSQL requires TLS.
[dependencies]
cms-db = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
cms-db = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# The wire tests drive the fake server, which only exists under test-util.
[[test]]
name = "store"
required-features = ["test-util"]
