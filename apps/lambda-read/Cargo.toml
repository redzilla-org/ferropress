# Deliberately small: no async runtime, no AWS SDK, no PHP engine. ureq (already admitted for
# xtask) talks to the local Lambda Runtime API over plain HTTP; serde_json decodes the event.
[dependencies]
cms-readmodel = { path = "../../crates/cms-readmodel" }
serde_json = { workspace = true }
